[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covharness"
version = "0.1.0"
description = "Leak-free benchmark for multivariate covariance forecasting"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Jim Lim" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "matplotlib",
    "nonlinshrink==0.7",
    "arch==8.0.0",
    "torch==2.13.0",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "statsmodels",
    "scikit-learn==1.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
